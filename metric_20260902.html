<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>런드리고 주간 지표회의</title>
<style>
:root{color-scheme:light;
 --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
 --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);
 --s1:#2a78d6;                      /* 이동평균 — categorical slot 1 */
 --s2:#eb6834;                      /* 기간 값  — categorical slot 2 */
 --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--goodtxt:#006300;
 --gooddim:rgba(12,163,12,.10);--critdim:rgba(208,59,59,.10);--warndim:rgba(250,178,25,.13);
 --band:rgba(11,11,11,.045);}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
 --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
 --s1:#3987e5;--s2:#d95926;--goodtxt:#0ca30c;
 --gooddim:rgba(12,163,12,.16);--critdim:rgba(208,59,59,.18);--warndim:rgba(250,178,25,.16);
 --band:rgba(255,255,255,.055);}}
:root[data-theme="dark"]{color-scheme:dark;
 --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
 --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);
 --s1:#3987e5;--s2:#d95926;--goodtxt:#0ca30c;
 --gooddim:rgba(12,163,12,.16);--critdim:rgba(208,59,59,.18);--warndim:rgba(250,178,25,.16);
 --band:rgba(255,255,255,.055);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif;background:var(--page);
 color:var(--ink);line-height:1.6;font-size:14px;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:30px 22px 72px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
h1{font-size:25px;font-weight:700;letter-spacing:-.4px;margin-top:6px;line-height:1.3}
.lede{color:var(--ink2);font-size:13.5px;margin-top:8px;max-width:80ch}
.sec{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin:26px 0 9px;
 text-transform:uppercase;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.asel{display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;
 font-size:12px;font-weight:600;color:var(--ink2)}
.asel select{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);
 border:1px solid var(--ring);border-radius:8px;padding:4px 8px;cursor:pointer}
.asel .stale{color:var(--warn);font-weight:700}
/* 카드 안 '기준' 칩 */
.bchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;
 font-size:11.5px;font-weight:700;color:var(--muted)}
.bchip{font-family:inherit;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;
 border:1px solid var(--ring);background:var(--surface);color:var(--ink2);cursor:pointer}
.bchip:hover{border-color:var(--axis);color:var(--ink)}
.bchip.on{background:var(--s1);border-color:var(--s1);color:#fff}
/* 연결 과제 */
.tasks{margin-top:14px;border-top:1px solid var(--grid);padding-top:10px}
.tk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--ink2)}
.btn.sm{font-size:12px;padding:4px 10px;border-radius:7px}
.tk-list{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.tk-list li{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);
 background:var(--page);border:1px solid var(--ring);border-radius:9px;padding:6px 10px}
.tk-list b{color:var(--ink)}
.tk-d{font-variant-numeric:tabular-nums;color:var(--s1);font-weight:700;white-space:nowrap}
.tk-o{color:var(--muted)}
.tk-m{color:var(--muted);flex-basis:100%;font-size:11.5px;line-height:1.5;white-space:normal}
.tk-x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.tk-x:hover{color:var(--crit)}
.tk-form{margin-top:9px;display:grid;grid-template-columns:1fr 130px 130px;gap:7px;align-items:start}
.tk-form input,.tk-form textarea{font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);
 border:1px solid var(--ring);border-radius:8px;padding:6px 9px;width:100%}
.tk-form textarea{grid-column:1/-1;resize:vertical;min-height:44px}
.tk-form .fbtns{grid-column:1/-1;display:flex;gap:7px}
.tk-empty{color:var(--muted);font-size:12px;margin-top:6px}
@media(max-width:700px){.tk-form{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:center}
.mhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:2px}
.mname{font-size:15px;font-weight:700;letter-spacing:-.2px}
.mval{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.15;margin:6px 0 2px;
 font-variant-numeric:tabular-nums}
.mval small{font-size:16px;font-weight:600;color:var(--ink2);margin-left:3px;letter-spacing:0}
/* 나란히 보는 두 값 — 비율 옆 절대 숫자, 또는 같은 매출의 다른 인식 */
.mpair{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 2px}
.mpair .mval{margin:0}
.mblk.alt .mval{font-size:27px;color:var(--ink2)}
.mblk.alt .mval small{font-size:14px}
.mlab{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:1px;letter-spacing:-.1px}
.mlab b{font-weight:700}
.mrow{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);
 font-variant-numeric:tabular-nums;margin-top:4px}
.mrow b{color:var(--ink)}
.mnote{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.55}
.up{color:var(--goodtxt)}.down{color:var(--crit)}.flat{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
 padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.g{background:var(--gooddim);color:var(--goodtxt)}
.badge.b{background:var(--critdim);color:var(--crit)}
.badge.n{background:var(--page);color:var(--muted);border:1px solid var(--ring)}
.badge i{font-style:normal;font-size:10px}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--ring);
 color:var(--ink2);background:var(--page);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.w{border-color:var(--s1);color:var(--s1)}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.sw{width:18px;height:3px;border-radius:2px;display:inline-block}
svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.tick{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.box{background:var(--surface);border:1px solid var(--ring);border-left:3px solid var(--s1);border-radius:12px;
 padding:15px 17px;margin-bottom:12px}
.box.bad{border-left-color:var(--crit)}.box.warnb{border-left-color:var(--warn)}
.box h4{font-size:14px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box p{color:var(--ink2);font-size:13.3px}.box p+p{margin-top:8px}
.box b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);
 font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:600;font-size:11px}
tbody tr:hover{background:var(--page)}
td.wkc{font-weight:700}
.tw{overflow-x:auto;max-height:430px;overflow-y:auto}
details.det{margin-top:14px;border-top:1px solid var(--grid);padding-top:10px}
/* 하위 지표 — 같은 그룹끼리 같은 음영. 홀수 그룹만 칠해 띠를 만듭니다 */
tr.gband > td{background:var(--band)}
tr.grow{cursor:default}
tr.grow.has > td:first-child{cursor:pointer}
tr.grow > td{border-top:1px solid var(--grid)}
tr.grow > td:first-child{font-weight:700}
tr.grow.has > td:first-child::before{content:'▸ ';color:var(--muted);font-weight:400}
tr.grow.has.open > td:first-child::before{content:'▾ '}
tr.child > td:first-child{padding-left:26px;color:var(--ink2)}
tr.child[hidden]{display:none}
td.note{color:var(--muted);font-size:11.5px;white-space:normal}
/* 분모 묶음 머리 — 퍼널이 좁아지는 지점 */
.dim{color:var(--muted);font-weight:400}
tr.aband > td{background:var(--band);color:var(--ink2);font-size:11.5px;
 padding:7px 10px;white-space:normal;border-top:1px solid var(--grid)}
/* 설명 안의 예시 표 — 907 vs 1,279 를 사람 다섯으로 보여 줍니다 */
table.ex{font-size:12px}
table.ex th,table.ex td{padding:5px 10px;white-space:nowrap;text-align:left}
table.ex td.y{color:var(--goodtxt);font-weight:700;text-align:center}
table.ex td.n{color:var(--crit);font-weight:700;text-align:center}
/* 분모 모집단 — 지표 이름 아래 한 줄. 이름은 "창", 이 줄은 "누구 중에서" */
span.dnote{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px;
 letter-spacing:-.1px;white-space:normal}
summary.dsum{font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink2);list-style:none;
 display:inline-flex;align-items:center;gap:6px}
summary.dsum::-webkit-details-marker{display:none}
summary.dsum::before{content:'▸';color:var(--muted);font-size:11px}
details[open]>summary.dsum::before{content:'▾'}
summary.dsum:hover{color:var(--ink)}
.defsum{font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);list-style:none}
.defsum::-webkit-details-marker{display:none}
.defsum::before{content:'▸ ';color:var(--muted)}
details[open]>.defsum::before{content:'▾ '}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{font-family:inherit;font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:20px;
 border:1px solid var(--ring);background:var(--surface);color:var(--ink2);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.drop{border:1.5px dashed var(--axis);border-radius:14px;background:var(--surface);
 padding:20px 22px;margin-top:20px;transition:border-color .12s,background .12s}
.drop.over{border-color:var(--s1);background:var(--page);border-style:solid}
.dz-title{font-size:14.5px;font-weight:700;margin-bottom:4px}
.dz-sub{color:var(--ink2);font-size:13px}
.dz-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px}
.dz-note{color:var(--muted);font-size:12px;margin-top:11px;line-height:1.6}
#msg{font-size:12.5px;font-weight:600}
#msg.ok{color:var(--goodtxt)} #msg.err{color:var(--crit)}
.btn{display:inline-block;font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;
 border:1px solid var(--ink);background:var(--ink);color:var(--page);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--ring)}
.btn.ghost:hover{border-color:var(--axis);color:var(--ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--page);
 border:1px solid var(--ring);border-radius:5px;padding:1px 5px}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--grid);color:var(--muted);
 font-size:12px;line-height:1.7}
@media(max-width:860px){.row{grid-template-columns:1fr}.wrap{padding:22px 14px 56px}}
</style>
</head>
<body>
<div class="wrap">
<h1>런드리고 주간 지표회의</h1>

<div id="body"></div>

<div class="card" style="margin-top:18px">
<details><summary class="defsum">전체 기간 표</summary>
<div style="margin-top:14px">
  <div class="tabs" id="gtabs">
    <button class="tab" type="button" data-g="주간" aria-pressed="true">주간</button>
    <button class="tab" type="button" data-g="월간" aria-pressed="false">월간</button>
  </div>
  <div class="tw"><table id="tall"></table></div>
</div>
</details>
</div>

<div class="card">
<details><summary class="defsum">지표 설명 — 이 숫자가 정확히 무엇인가</summary>
<div id="defbody" style="margin-top:14px"></div>
</details>
</div>

<div id="drop" class="drop">
  <div class="dz-title">결과 CSV 올리기</div>
  <p class="dz-sub"><code>50_지표정의서_통합.sql</code> 결과를 CSV로 저장한 뒤
    <b>여기에 끌어다 놓거나</b> 아래 버튼으로 선택하세요.</p>
  <div class="dz-row">
    <label class="btn" for="file">CSV 파일 선택</label>
    <input type="file" id="file" accept=".csv,text/csv" hidden="">
    <button class="btn" onclick="exportBaked()" title="지금 올린 CSV 를 파일 안에 넣어 새 HTML 로 받습니다. 받는 사람은 열기만 하면 됩니다.">데이터 넣어 내보내기</button>
    <button class="btn ghost" onclick="resetData()">비우기</button>
    <span id="msg" class="ok"></span>
  </div>
  <div class="dz-note">UTF-8 · CP949(엑셀 한글) 자동 인식 · 컬럼 <b>이름</b>으로 찾으므로 순서는 상관없습니다.<br>
    CSV 를 올린 뒤 <b>데이터 넣어 내보내기</b> 를 누르면 <b>데이터가 들어 있는 HTML</b> 이 받아집니다.
    그 파일을 공유하면 받는 사람은 <b>열기만</b> 하면 됩니다.</div>
</div>

<footer id="foot"></footer>
</div>

  const seen = { '주간': new Set(), '월간': new Set() };
  DATA.forEach(r => {
    IDX.set(r.g + '|' + r.p + '|' + kk(r.cat, r.d1, r.d2), r);
    if (seen[r.g] && !seen[r.g].has(r.p)) { seen[r.g].add(r.p); PER[r.g].push(r.p); }
  });
  PER['주간'].sort(); PER['월간'].sort();
}
const get = (g, p, s) => IDX.get(g + '|' + p + '|' + kk(s.cat, s.d1, s.d2)) || null;

/* 전년 동기 : 주간은 -364일(같은 요일), 월간은 -12개월 */
function prevP(g, p) {
  if (g === '주간') {
    const d = new Date(p + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - 364);
    return d.toISOString().slice(0, 10);
  }
  const y = +p.slice(0, 4), m = p.slice(5);
  return (y - 1) + '-' + m;
}
const plabel = p => p.length > 7 ? p.slice(5).replace('-', '/') : p.slice(2);
const MAW = g => (g === '주간' ? 4 : 3);
/* ★ 기준 기간(as-of) — 고른 시점까지의 데이터만 씁니다.
   "8주 전 회의에서는 무엇이 보였나" 를 그대로 재현하려면 그 시점 이후 데이터가
   차트·이동평균·최신 확정 판정 어디에도 섞이면 안 됩니다. 그래서 기간 목록 자체를
   잘라 두고, 아래 모든 계산이 이 목록만 보게 합니다. */
const PERV = g => (ASOF[g] ? PER[g].filter(p => p <= ASOF[g]) : PER[g]);
/* 선택 메뉴에 올릴 기간 — 주간은 최근 9주(현재+8), 월간은 최근 7개월(현재+6) */
const asofChoices = g => PER[g].slice(g === '주간' ? -9 : -7).reverse();

/* 한 카드의 시계열. sum 이면 분자·분모를 더한 뒤 비율을 다시 계산합니다
   (비율의 평균이 아니라 분자합÷분모합 — 기간마다 분모가 다르기 때문입니다). */
function series(card, sel) {
  const g = card.g, sp = specOf(sel);
  const sels = sp ? (sp.sum || [sp.sel]) : (card.sum || [card.sel]);
  /* partial = 확정된 하위만 모아 합칩니다. 약정 개월처럼 <b>확정 시점이 서로 다른</b>
     줄을 묶을 때만 씁니다 — 하나라도 미확정이면 전부 비우는 기본 규칙으로는
     플러스 합계가 영원히 비기 때문입니다. 대신 구성이 달의 흐름에 따라 바뀌므로
     어떤 약정이 들어갔는지 표에 같이 적습니다. */
  const partial = !!(sp && sp.partial);
  return PERV(g).map(p => {
    let users = 0, den = 0, amt = 0, obs = 1, hit = 0, hasU = 0, hasD = 0, hasA = 0;
    sels.forEach(s => {
      const r = get(g, p, s);
      if (!r || !r.obs) { if (!partial) obs = 0; return; }
      hit++;
      if (r.users != null) { users += r.users; hasU = 1; }
      if (r.den   != null) { den   += r.den;   hasD = 1; }
      if (r.amt   != null) { amt   += r.amt;   hasA = 1; }
    });
    if (!hit || !obs) return { p, v: null, users: null, den: null, amt: null, obs: 0 };
    let v = null;
    if (card.kind === 'rate')  v = hasD && den ? users / den * 100 : null;
    else if (card.kind === 'count') v = hasU ? users : null;
    else                        v = hasA ? amt : null;
    return { p, v, users: hasU ? users : null, den: hasD ? den : null, amt: hasA ? amt : null, obs: 1 };
  });
}

/* 이동평균 — 비율은 분자합÷분모합, 나머지는 값의 평균. 창 안이 모두 확정일 때만. */
function withMa(S, card) {
  const w = MAW(card.g);
  return S.map((o, i) => {
    if (i < w - 1) return { ...o, ma: null };
    const win = S.slice(i - w + 1, i + 1);
    if (win.some(x => x.v == null)) return { ...o, ma: null };
    let ma;
    if (card.kind === 'rate') {
      const su = win.reduce((a, x) => a + x.users, 0), sd = win.reduce((a, x) => a + x.den, 0);
      ma = sd ? su / sd * 100 : null;
    } else ma = win.reduce((a, x) => a + x.v, 0) / w;
    return { ...o, ma };
  });
}

/* 전년 동기 · 오차범위 · 판정 */
function judge(S, card) {
  const M = new Map(S.map(o => [o.p, o]));
  return S.map(o => {
    const q = M.get(prevP(card.g, o.p)) || null;
    const vp = q ? q.v : null;
    let ci = null, dd = null, pctd = null, j = null;
    if (o.v != null && vp != null) {
      dd = o.v - vp;
      pctd = vp ? (o.v - vp) / Math.abs(vp) * 100 : null;
      if (card.kind === 'rate' && o.den && q.den) {
        const a = o.v / 100, b = vp / 100;
        ci = 1.96 * Math.sqrt(a * (1 - a) / o.den + b * (1 - b) / q.den) * 100;
        j = Math.abs(dd) <= ci ? '노이즈' : (dd >= 0 ? '개선' : '악화');
      } else {
        /* 총량 지표는 이항분산 가정이 성립하지 않아 오차범위를 만들지 않습니다.
           방향만 표시하고 "판정" 이라 부르지 않습니다. */
        j = pctd == null ? null : (pctd >= 0 ? '증가' : '감소');
      }
    }
    return { ...o, vp, dd, pctd, ci, j };
  });
}

function build(card, sel) { return judge(withMa(series(card, sel), card), card); }
const lastOk = S => { for (let i = S.length - 1; i >= 0; i--) if (S[i].v != null) return S[i]; return null; };

function badge(j, kind) {
  if (!j) return '<span class="badge n">—</span>';
  if (j === '악화') return '<span class="badge b"><i>▼</i>악화</span>';
  if (j === '개선') return '<span class="badge g"><i>▲</i>개선</span>';
  if (j === '감소') return '<span class="badge b"><i>▼</i>감소</span>';
  if (j === '증가') return '<span class="badge g"><i>▲</i>증가</span>';
  return '<span class="badge n">노이즈 (범위 안)</span>';
}
/* 금액은 자릿수가 커서 그대로 쓰면 읽히지 않습니다.
   총액(원)은 억/만으로 줄이고, 단가(원/수거)는 정확한 값이 중요하므로 그대로 둡니다. */
function money(v, unit) {
  if (v == null) return '—';
  if (unit === '원/수거') return nf(v);
  const a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(2) + '억';
  if (a >= 1e4) return (v / 1e4).toFixed(0) + '만';
  return nf(v);
}
function fmt(v, card, unit) {
  if (v == null) return '—';
  if (card.kind === 'rate') return v.toFixed(2) + '%';
  if (card.kind === 'count') return nf(v);
  return money(v, unit);
}
function unitOf(card, sel) {
  const s = mainSel(sel) || card.sel || (card.sum || [])[0];
  const PV = PERV(card.g);
  for (let i = PV.length - 1; i >= 0; i--) {
    const r = get(card.g, PV[i], s);
    if (r && r.unit) return r.unit;
  }
  return '';
}

/* 하위 지표는 대표 지표와 종류가 다를 수 있습니다(건수 아래에 비율, 비율 아래에 건수).
   그래서 CSV 의 어느 칸이 채워져 있는지로 종류를 판별해 씁니다. */
function effKind(c, s) {
  if (!s) return c.kind;
  const m = mainSel(s);
  const PV = PERV(c.g);
  for (let i = PV.length - 1; i >= 0; i--) {
    const r = get(c.g, PV[i], m);
    if (!r) continue;
    if (r.rate != null) return 'rate';
    if (r.amt  != null) return 'amt';
    if (r.users != null) return 'count';
  }
  return c.kind;
}
const cardFor = (c, s) => (s ? { ...c, kind: effKind(c, s) } : c);

/* ══ 하위 지표 그룹 ═══════════════════════════════════════════════
   같은 갈래끼리 묶어 음영으로 구분하고, 자식이 있는 그룹은 눌러서 펼칩니다.
   구독리텐션만 구조가 달라 따로 만듭니다 — 요금제(일반/플러스)를 위로 올리고
   그 아래에 신규/재구독 · 약정 개월을 답니다. */
function retentionGroups(c) {
  const rows = DATA.filter(r => r.cat === '5. 구독리텐션' && r.g === c.g);
  const d1s = [...new Set(rows.map(r => r.d1))];
  const labs = [...new Set(rows.map(r => r.d2))]
    .filter(x => x.indexOf('누적') === 0).sort();
  const plus = d1s.filter(x => x.indexOf('플러스') === 0)
    .sort((a, b) => (parseInt(a.replace(/\D/g, ''), 10) || 0) - (parseInt(b.replace(/\D/g, ''), 10) || 0));
  const entry = ['신규구독', '재구독'].filter(x => d1s.includes(x));
  const out = [];
  if (d1s.includes('일반')) labs.forEach(l => out.push({
    fam: '일반',
    label: '일반 · ' + l.replace('누적 · ', '').replace('까지', ''),
    spec: K('5. 구독리텐션', '일반', l),
    children: entry.map(e => ({ label: e, spec: K('5. 구독리텐션', e, l) }))
  }));
  if (plus.length) labs.forEach(l => out.push({
    fam: '플러스',
    label: '플러스 · ' + l.replace('누적 · ', '').replace('까지', ''),
    spec: { sum: plus.map(t => K('5. 구독리텐션', t, l)), partial: true },
    children: plus.map(t => ({ label: t, spec: K('5. 구독리텐션', t, l) })),
    note: '약정별 확정 시점이 달라 <b>확정된 약정만</b> 합산합니다 (분자합÷분모합)'
  }));
  return out;
}
/* 그 외 카드 — 1Depth 로 묶고, "전체" 가 있으면 그것을 그룹 대표 줄로 씁니다.
   flatGroups 인 카드는 묶지 않고 <b>줄 하나하나를 그대로</b> 세웁니다 (퍼널). */
function genericGroups(c) {
  const SB = subsOf(c);
  if (c.flatGroups) return SB.map(x => ({
    fam: c.alignFam ? '_' : undefined,
    label: x.d2 || x.d1, spec: x, children: []
  }));
  const by = new Map();
  SB.forEach(x => { if (!by.has(x.d1)) by.set(x.d1, []); by.get(x.d1).push(x); });
  const out = [];
  by.forEach((arr, d1) => {
    const hi = arr.findIndex(x => x.d2 === '전체' || x.d2 === '');
    const head = hi >= 0 ? arr[hi] : arr[0];
    const kids = arr.filter(x => x !== head);
    out.push({
      /* alignFam 이면 전부 한 가족으로 묶어 <b>같은 코호트</b>로 맞춥니다
         (퍼널처럼 분모가 같은 줄들은 코호트가 섞이면 안 됩니다) */
      fam: c.alignFam ? '_' : undefined,
      label: head.d2 && head.d2 !== '전체' ? d1 + ' · ' + head.d2 : d1,
      spec: head,
      children: kids.map(x => ({ label: x.d2 || x.d1, spec: x }))
    });
  });
  return out;
}
const groupsOf = c => (c.subsFrom === '5. 구독리텐션' ? retentionGroups(c) : genericGroups(c));

/* ══ 차트 ═══════════════════════════════════════════════════════════ */
function chart(S, unit, marks) {
  const H = 132, WD = 300, L = 46, R = 8, T = 10, B = 18;
  const vs = S.map(o => o.v), ms = S.map(o => o.ma);
  const ok = [...vs, ...ms].filter(v => v != null);
  if (ok.length < 2) return '<div style="color:var(--muted);font-size:12px">그릴 값이 부족합니다</div>';
  let lo = Math.min(...ok), hi = Math.max(...ok);
  const pad = (hi - lo || Math.abs(hi) * 0.1 || 1) * 0.22; lo -= pad; hi += pad;
  const span = hi - lo;
  const mag = Math.pow(10, Math.floor(Math.log10(span / 3)));
  let step = mag; [1, 2, 2.5, 5, 10].some(m => { if (mag * m >= span / 4) { step = mag * m; return true; } });
  const tk = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) tk.push(v);
  /* 눈금 라벨은 <b>눈금 간격(step)</b>에 맞춰 자릿수를 정합니다.
     값 크기로만 정하면 13,500 과 14,500 이 둘 다 "1.4만" 이 되어 눈금이 겹칩니다. */
  const dec = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
  const lbl = v => {
    if (unit === '원') {
      if (Math.abs(hi) >= 1e8) return (v / 1e8).toFixed(step >= 1e8 ? 0 : 1) + '억';
      if (Math.abs(hi) >= 1e4) return (v / 1e4).toFixed(step >= 1e4 ? 0 : 1) + '만';
    }
    return v.toLocaleString('ko-KR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  };
  const x = i => L + i * (WD - L - R) / Math.max(1, S.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / span);

  let s = `<svg viewBox="0 0 ${WD} ${H}" role="img" aria-label="기간 추이">`;
  (marks || []).forEach(m => {
    if (m.i < 0 || m.i >= S.length) return;
    s += `<line x1="${x(m.i).toFixed(1)}" y1="${T}" x2="${x(m.i).toFixed(1)}" y2="${H - B}"
      stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"><title>${esc(m.t.date + ' ' + m.t.title)}</title></line>`;
  });
  tk.forEach(t => { s += `<line class="gridline" x1="${L}" y1="${y(t).toFixed(1)}" x2="${WD - R}" y2="${y(t).toFixed(1)}"/>`
    + `<text class="tick" x="${L - 6}" y="${y(t).toFixed(1)}" text-anchor="end" dominant-baseline="middle">${lbl(t)}</text>`; });
  const path = (arr, col, w) => {
    let d = '', st = false;
    arr.forEach((v, i) => { if (v == null) { st = false; return; }
      d += (st ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; st = true; });
    return d ? `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}"
      stroke-linejoin="round" stroke-linecap="round"/>` : '';
  };
  s += path(vs, 'var(--s2)', 1.2) + path(ms, 'var(--s1)', 2);
  for (let i = vs.length - 1; i >= 0; i--) if (vs[i] != null) {
    s += `<circle cx="${x(i).toFixed(1)}" cy="${y(vs[i]).toFixed(1)}" r="3.4"
      fill="var(--s2)" stroke="var(--surface)" stroke-width="1.6"/>`; break; }
  [0, Math.floor(S.length / 2), S.length - 1].forEach(i => {
    s += `<text class="tick" x="${x(i).toFixed(1)}" y="${H - B + 13}" text-anchor="middle">${plabel(S[i].p)}</text>`; });
  return s + '</svg>';
}

/* ══ 렌더 ═══════════════════════════════════════════════════════════ */
function render() {
  reindex();
  if (!DATA.length) {
    if ($('alerts')) $('alerts').innerHTML = '';
    $('body').innerHTML = `<div class="card"><p style="color:var(--ink2)">
      아래에 <code>50_지표정의서_통합.sql</code> 결과 CSV 를 끌어다 놓으면 시작합니다.
      과제는 CSV 를 올린 뒤 각 지표 카드에서 등록할 수 있습니다.
      정의만 먼저 보시려면 <b>맨 아래 「지표 설명」</b> 을 펼치세요.</p></div>`;
    $('tall').innerHTML = ''; $('foot').innerHTML = '생성 ' + new Date().toISOString().slice(0, 10);
    renderDefs(); return;
  }

  /* 자동 안건 · 창 보정 박스는 화면에서 뺐습니다(현업 요청).
     되살리려면 head 의 <div id="alerts"></div> 한 줄만 다시 넣으면 아래 로직이 그대로 돕니다. */
  if ($('alerts')) {
    /* ── 이번 주 안건 : 비율 지표 중 최근 확정 4기간에서 3회 이상 악화 ── */
    const alerts = [];
    CARDS.filter(c => c.kind === 'rate').forEach(c => {
      const S = build(c).filter(o => o.v != null).slice(-4);
      const n = S.filter(o => o.j === '악화').length;
      if (S.length >= 3 && n >= 3) alerts.push({ c, n, S });
    });
    let al = '';
    if (alerts.length) {
      al += `<div class="box bad"><h4><span class="pill">이번 주 안건</span>${
        alerts.map(o => esc(o.c.name.split(' · ')[0])).join(' · ')}</h4>` +
        alerts.map(o => `<p><b>${esc(o.c.name)}</b> — 최근 확정 ${o.S.length}기간 중 <b>${o.n}회 악화</b>
          · 값 ${o.S.map(x => x.v.toFixed(1)).join(' → ')}
          (전년비 ${o.S.map(x => pp(x.dd)).join(' → ')})</p>`).join('') +
        `<p>해당 코호트 기간의 <b>액션</b>과 <b>분모(유입)</b> 변화를 먼저 확인하세요.
         나머지 줄이 노이즈 범위라면 문제는 <b>이 단계에 국한</b>된 것입니다.</p></div>`;
    } else {
      al += `<div class="box"><h4><span class="pill">이번 주</span>연속 악화인 비율 지표가 없습니다</h4>
        <p>전년 동기와 통계적으로 구분되지 않거나, 악화가 이어지지 않았습니다.
        추세(이동평균) 방향만 확인하고 넘어가셔도 됩니다.</p></div>`;
    }
    /* 앞당김 검증 — 같은 코호트 주끼리만 비교합니다 (30일과 90일은 지연이 달라
       "최신 확정" 끼리 견주면 서로 다른 주를 비교하게 됩니다) */
    const c3 = CARDS.find(c => c.id === 'c2');
    const S28 = build(c3, K('2. 주문', '2회차 주문 (첫 주문 후 30일)')),
          S90 = build(c3, K('2. 주문', '앞당김 검증 (90일 2회차)'));
    const M90 = new Map(S90.map(o => [o.p, o]));
    const pairs = S28.map(o => ({ p: o.p, a: o, b: M90.get(o.p) }))
      .filter(o => o.b && o.a.dd != null && o.b.dd != null && Math.abs(o.a.dd) > 1.0).slice(-12);
    if (pairs.length >= 4) {
      const rs = pairs.map(o => o.b.dd / o.a.dd).sort((x, y) => x - y);
      const ratio = rs.length % 2 ? rs[(rs.length - 1) / 2] : (rs[rs.length / 2 - 1] + rs[rs.length / 2]) / 2;
      const span = `${plabel(pairs[0].p)}~${plabel(pairs[pairs.length - 1].p)} 주 · ${pairs.length}주`;
      const down = pairs.filter(o => o.a.dd < 0).length > pairs.length / 2;
      if (ratio > 1.15 && down) {
        al += `<div class="box warnb"><h4><span class="pill">창 보정</span>30일 창이 하락을 <b>축소</b>해 보여주고 있습니다</h4>
          <p>둘 다 확정된 코호트(${span})에서 <b>효과비 중앙값 ${ratio.toFixed(2)}</b> —
          같은 주를 90일로 보면 <b>${ratio.toFixed(1)}배</b> 더 나쁩니다.
          2회차 주문율이 "노이즈" 로 떠도 안심하시면 안 됩니다.</p></div>`;
      } else if (ratio < 0.5) {
        al += `<div class="box bad"><h4><span class="pill">앞당김</span>30일에서 보이는 변화가 90일에서 사라집니다</h4>
          <p>둘 다 확정된 코호트(${span})에서 <b>효과비 중앙값 ${ratio.toFixed(2)}</b> —
          <b>총량을 바꾼 게 아니라 시점만 옮긴 것</b>일 가능성이 높습니다.</p></div>`;
      }
    }
    $('alerts').innerHTML = al;
  }

  /* ── 카드 ─────────────────────────────────────────────────────── */
  let html = '', lastG = '';
  CARDS.forEach(c => {
    if (c.g !== lastG) { html += sectionHead(c.g); lastG = c.g; }
    const S = build(c);
    /* ★ 대표 값도 상세 표와 <b>같은 코호트</b>로 맞춥니다.
       예전에는 대표가 "최신 확정"(2026-06), 상세가 "퍼널 정렬"(2026-04) 이라
       카드 2,363명과 표 1,588명이 서로 안 맞아 읽는 사람이 더해 보게 됐습니다. */
    /* 기준이 있는 카드는 그 지표의 최신 확정 주로 카드 전체를 맞춥니다 */
    const bs = basisOf(c);
    const basisP = bs ? (lastOk(build(cardFor(c, bs.spec), bs.spec)) || {}).p : null;
    const r = basisP ? (pickAt(S, basisP) || lastOk(S)) : lastOk(S);
    /* 상세 표의 퍼널은 1·2·3회차가 <b>모두</b> 확정된 코호트로 맞춥니다.
       대표 값까지 거기에 묶었더니 3회차 확정이 가장 늦어 카드가 2~4개월 뒤처지고,
       기준 월을 바꿔도 값이 안 변하는 죽은 지표가 됐습니다(2026-08~04 전부 51.26%).
       그래서 대표 값은 <b>자기 지표의 최신 확정</b>을 쓰고, 상세 표 코호트는 따로 알려줍니다. */
    /* 기준 칩이 있으면 카드 전체가 그 코호트로 내려가므로 퍼널 정렬 안내는 불필요합니다 */
    const famP = (!basisP && c.alignFam && c.headFam) ? famPeriods(c, groupsOf(c))[c.headFam] : null;
    if (!r) {
      html += `<div class="card"><div class="mhead"><span class="mname">${esc(c.name)}</span>
        <span class="pill w">${c.g}</span></div>
        <p class="mnote">아직 확정된 코호트가 없습니다 — 창이 차기까지 ${c.lag} ${c.g === '주간' ? '주' : '개월'} 이상 걸립니다.
        CSV 에 해당 지표 행이 있는지도 확인해 주세요.</p></div>`;
      return;
    }
    const noisy = r.j === '노이즈';
    const dcls = r.dd == null ? 'flat' : noisy ? 'flat' : (r.dd >= 0 ? 'up' : 'down');
    const unit = c.kind === 'rate' ? '' : unitOf(c);
    /* ★ 나란히 보는 두 번째 값 — 비율 옆의 <b>절대 숫자</b>(첫 주문자수),
       또는 같은 매출을 다르게 인식한 값(플러스 분할). 같은 코호트/달을 씁니다. */
    const A = (() => {
      if (!c.alt) return null;
      const asel = c.alt.spec || c.sel;
      const ac = { ...c, kind: c.alt.kind || effKind(c, asel) };
      const AS = build(ac, asel);
      const ar = basisP ? (pickAt(AS, basisP) || lastOk(AS)) : lastOk(AS);
      if (!ar || ar.v == null) return null;
      /* 같은 CSV 행을 다른 종류로 읽을 때는 단위도 다릅니다(비율 행의 이용자수 → '명') */
      const au = c.alt.unit != null ? c.alt.unit : (ac.kind === 'rate' ? '' : unitOf(ac, asel));
      return { r: ar, card: ac, unit: au };
    })();
    const bigVal = (v, cc, u) => `${fmt(v, cc, u)}${u ? `<small>${esc(u)}</small>` : ''}`;
    html += `<div class="card">
      <div class="row">
        <div>
          <div class="mhead"><span class="mname">${esc(c.name)}</span>
            <span class="pill w">${c.g}</span>
            <span class="pill">${r.p} 코호트</span>${badge(r.j, c.kind)}</div>
          ${A ? `<div class="mpair">
            <div class="mblk"><div class="mval">${bigVal(r.v, c, unit)}</div>
              <div class="mlab">${esc(c.altMain || c.name.split(' · ')[0])}</div></div>
            <div class="mblk alt"><div class="mval">${bigVal(A.r.v, A.card, A.unit)}</div>
              <div class="mlab">${esc(c.alt.label)}${A.r.pctd != null
                ? ` · 전년비 <b class="${A.r.pctd >= 0 ? 'up' : 'down'}">${pc(A.r.pctd)}</b>` : ''}</div></div>
          </div>${c.alt.note ? `<div class="mnote" style="margin-top:2px">오른쪽 = ${esc(c.alt.note)}${
            /* ★ 억 단위로 반올림하면 두 값이 같아 보일 수 있습니다(실측: 전체는 같은데
                  구독만 0.01억 차이). 그래서 <b>원 단위 차이</b>를 그대로 적어 둡니다. */
            (c.alt.diff && A.card.kind === 'amt' && r.v != null)
              ? ` · <b>기본 대비 ${A.r.v - r.v >= 0 ? '+' : '−'}${nf(Math.abs(A.r.v - r.v))}원</b>` +
                (Math.abs(A.r.v - r.v) < 5e6
                  ? ` <span class="dim">— 억 단위로는 반올림돼 같아 보입니다</span>` : '')
              : ''}</div>` : ''}`
          : `<div class="mval">${bigVal(r.v, c, unit)}</div>`}
          <div class="mrow">
            <span>${MAW(c.g)}${c.g === '주간' ? '주' : '개월'} 평균 <b>${fmt(r.ma, c, unit)}</b></span>
            <span>전년 동기 <b>${fmt(r.vp, c, unit)}</b></span>
            <span class="${dcls}">${c.kind === 'rate'
              ? `차이 <b>${pp(r.dd)}</b> · 오차범위 ±${r.ci == null ? '—' : r.ci.toFixed(2)}%p`
              : `전년비 <b>${pc(r.pctd)}</b>`}</span>
            ${/* 비율만 두면 크기 감각이 없어집니다 — 분자와 분모를 같이 보여줍니다.
                  값 자체가 건수인 줄(count)은 분자가 값과 같으므로 분모만 냅니다.
                  분자를 이미 <b>옆에 큰 숫자로</b> 띄운 카드는 여기서 분모만 냅니다. */''}
            ${(A && c.alt.kind === 'count' && !c.alt.spec)
              ? (r.den != null ? `<span>분모 <b>${nf(r.den)}</b></span>` : '')
              : (c.kind !== 'count' && r.users != null)
              ? `<span>이용자수 <b>${nf(r.users)}</b>${r.den != null ? ` / 분모 <b>${nf(r.den)}</b>` : ''}</span>`
              : (r.den != null ? `<span>분모 <b>${nf(r.den)}</b></span>` : '')}
          </div>
          ${famP && famP !== r.p ? `<div class="mrow" style="margin-top:2px">
            <span style="color:var(--muted)">아래 <b>상세 표의 퍼널</b>은 1·2·3회차가 모두 확정된 <b>${famP}</b> 코호트 기준입니다
              — 이 카드와 <b>달이 다르니 더하거나 견주지 마세요</b></span></div>` : ''}
          <div class="mnote">${c.cap}<br>${c.tip}</div>
          ${basisChips(c)}
        </div>
        <div>
          <div class="legend"><span class="lg"><i class="sw" style="background:var(--s2)"></i>기간 값</span>
            <span class="lg"><i class="sw" style="background:var(--s1)"></i>${MAW(c.g)}${c.g === '주간' ? '주' : '개월'} 평균</span></div>
          ${(() => { const SS = basisP ? S.filter(o => o.p <= basisP) : S;
                      return chart(SS, unit, taskMarks(c, SS.map(o => o.p))); })()}
        </div>
      </div>
      ${subTable(c, basisP)}
      ${taskList(c)}
    </div>`;
  });
  $('body').innerHTML = html;

  renderTable();
  const W = PER['주간'], M = PER['월간'];
  const asofNote = (ASOF['주간'] || ASOF['월간'])
    ? `<b>기준 시점</b> 주간 ${ASOF['주간'] || '최신'} · 월간 ${ASOF['월간'] || '최신'} — 그 이후 데이터는 계산에서 제외했습니다<br>` : '';
  $('foot').innerHTML = asofNote +
    `주간 ${W[0] || '—'} ~ ${W[W.length - 1] || '—'} (${W.length}주) · 월간 ${M[0] || '—'} ~ ${M[M.length - 1] || '—'} (${M.length}개월)<br>`
    + `창이 안 찬 코호트는 비웁니다 — 비는 기간 = ceil(창÷7)주. 첫 주문 1 · 2회차 6 · 3회차 10 · 구독 전환 5 · 앞당김 13<br>`
    + `수거신청 필터 <code>status not in (4,17)</code> · <code>laundry24_pgi is null</code> · 가입 모수는 전수(LAUNDRY24 계정만 제외)<br>`
    + `생성 ${new Date().toISOString().slice(0, 10)}`;
  renderDefs();
}

/* 카드 안의 '기준' 칩 — 어느 지표가 확정된 코호트를 볼 것인가.
   고른 지표의 최신 확정 주로 <b>카드 전체(대표 줄 + 하위 줄)</b>가 함께 내려갑니다. */
function basisOf(c) {
  if (!c.basis) return null;
  const k = BASIS[c.id] || c.basis[0].key;
  return c.basis.find(b => b.key === k) || c.basis[0];
}
function basisChips(c) {
  const cur = basisOf(c); if (!cur) return '';
  return `<div class="bchips">기준
    ${c.basis.map(b => `<button class="bchip${b.key === cur.key ? ' on' : ''}"
      data-basis="${c.id}|${b.key}">${esc(b.label)}</button>`).join('')}</div>`;
}

/* 섹션 머리 — 기준 기간을 고르면 그 섹션 리포트 <b>전체</b>가 그 시점 기준으로 바뀝니다 */
function sectionHead(g) {
  const ch = asofChoices(g), unit = g === '주간' ? '주' : '월';
  if (!ch.length) return `<div class="sec">${g} 지표</div>`;
  const cur = ASOF[g] || ch[0];
  const opts = ch.map((p, i) => `<option value="${p}"${p === cur ? ' selected' : ''}>${p}${i === 0 ? ' (최신)' : ` · ${i}${unit} 전`}</option>`).join('');
  const stale = ASOF[g] && ASOF[g] !== ch[0]
    ? `<span class="stale">${ch.indexOf(ASOF[g])}${unit} 전 시점으로 보는 중</span>` : '';
  return `<div class="sec"><span>${g} 지표</span>
    <label class="asel">기준 ${unit}
      <select data-asof="${g}">${opts}</select>
    </label>${stale}</div>`;
}

/* ── 연결 과제 ────────────────────────────────────────────────────
   지표마다 "무엇을 해서 이렇게 됐는가" 를 붙여 둡니다. 입력한 과제는 CSV 와 함께
   내보내기 파일에 구워지므로, 받는 사람은 열기만 하면 과제까지 같이 봅니다.
   시작일을 적으면 그 카드 차트에 <b>세로 점선</b>으로 표시됩니다. */
function taskList(c) {
  const T = (TASKS[c.id] || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const items = T.length
    ? '<ul class="tk-list">' + T.map(t => `<li>
        ${t.date ? `<span class="tk-d">${esc(t.date)}</span>` : ''}
        <b>${esc(t.title)}</b>
        ${t.owner ? `<span class="tk-o">${esc(t.owner)}</span>` : ''}
        <button class="tk-x" data-del="${c.id}|${t.id}" title="삭제">×</button>
        ${t.memo ? `<span class="tk-m">${esc(t.memo)}</span>` : ''}
      </li>`).join('') + '</ul>'
    : '<p class="tk-empty">아직 등록된 과제가 없습니다. 이 지표를 움직이려고 한 일을 적어 두면 다음 회의에서 원인을 찾기 쉬워집니다.</p>';
  const form = OPENFORM === c.id ? `<div class="tk-form">
      <input data-f="title" placeholder="과제 이름 (예: 첫 수거신청 UX 단순화)" maxlength="80">
      <input data-f="date" type="date" title="시작일">
      <input data-f="owner" placeholder="담당" maxlength="20">
      <textarea data-f="memo" placeholder="메모 — 무엇을 바꿨고 무엇을 기대하는지 (선택)" maxlength="300"></textarea>
      <div class="fbtns">
        <button class="btn sm" data-save="${c.id}">저장</button>
        <button class="btn ghost sm" data-cancel="1">취소</button>
      </div></div>` : '';
  return `<div class="tasks">
    <div class="tk-head">연결 과제 <span class="pill">${T.length}</span>
      ${OPENFORM === c.id ? '' : `<button class="btn ghost sm" data-add="${c.id}">+ 과제 추가</button>`}</div>
    ${items}${form}</div>`;
}
/* 과제 시작일이 들어 있는 기간의 위치 — 차트 세로선용 */
function taskMarks(c, P) {
  const T = (TASKS[c.id] || []).filter(t => t.date);
  return T.map(t => {
    let i = -1;
    for (let k = 0; k < P.length; k++) if (P[k] <= (c.g === '주간' ? t.date : t.date.slice(0, 7))) i = k;
    return i >= 0 ? { i, t } : null;
  }).filter(Boolean);
}

/* 상세 — 하위 지표 표 (그룹별 음영 + 펼침 + 코호트 정렬) */
const pickAt = (S, p) => (p ? (S.find(o => o.p === p) || null) : lastOk(S));

function metricRow(c, spec, cls, label, atP) {
  const cc = cardFor(c, spec);
  const S = build(cc, spec), r = pickAt(S, atP), u = cc.kind === 'rate' ? '' : unitOf(c, spec);
  /* 분모 모집단을 이름 아래 한 줄로 — 창은 이름이, 분모는 이 줄이 말합니다.
     denBands 카드는 묶음 머리에 한 번만 적으므로 줄마다 반복하지 않습니다. */
  const dn = c.denBands ? '' : denOf(spec);
  const nm = esc(label) + (dn ? `<span class="dnote">분모 · ${esc(dn)}</span>` : '');
  if (!r || r.v == null) return `<tr class="${cls}"><td>${nm}</td>
    <td>${atP || '—'}</td>
    <td style="color:var(--warn);font-weight:700">미확정</td>
    <td colspan="5" style="text-align:left;color:var(--muted)">${atP ? '창이 아직 안 찼습니다' : '확정된 코호트가 없습니다'}</td></tr>`;
  const col = r.j === '악화' || r.j === '감소' ? 'var(--crit)'
            : r.j === '개선' || r.j === '증가' ? 'var(--goodtxt)' : 'inherit';
  /* 이용자수 = 분자. 값 자체가 건수인 줄(count)에서는 같은 숫자라 비웁니다. */
  const nu = cc.kind === 'count' ? '' : nf(r.users);
  return `<tr class="${cls}"><td>${nm}</td>
    <td>${r.p}</td>
    <td style="color:${col};font-weight:600">${fmt(r.v, cc, u)}</td>
    <td>${nu}</td>
    <td>${nf(r.den)}</td><td>${fmt(r.ma, cc, u)}</td><td>${fmt(r.vp, cc, u)}</td>
    <td>${cc.kind === 'rate' ? pp(r.dd) + (r.ci != null ? ' ±' + r.ci.toFixed(1) : '') : pc(r.pctd)}</td></tr>`;
}

/* ★ 코호트 정렬 — 퍼널은 <b>같은 코호트</b> 안에서만 읽힙니다.
   줄마다 "최신 확정" 을 쓰면 1회차는 6월 · 2회차는 5월 · 3회차는 4월 코호트가 되어
   분모가 2,958 → 1,926 → 3,098 로 널뛰고 퍼널이 깨져 보입니다.
   그래서 같은 갈래(일반 / 플러스)는 <b>셋 다 확정된 가장 최근 코호트</b>로 맞춥니다. */
function famPeriods(c, G) {
  const out = {};
  if (!c.alignFam) return out;
  const byFam = new Map();
  G.forEach(g => { const f = g.fam || '_'; if (!byFam.has(f)) byFam.set(f, []); byFam.get(f).push(g); });
  byFam.forEach((gs, fam) => {
    const ser = gs.map(g => new Map(build(cardFor(c, g.spec), g.spec).map(o => [o.p, o])));
    const ps = PERV(c.g).slice().reverse();
    out[fam] = ps.find(p => ser.every(m => { const o = m.get(p); return o && o.v != null; })) || null;
  });
  return out;
}

function subTable(c, forceP) {
  const G = groupsOf(c);
  if (!G.length) return '';
  const FP = forceP ? null : famPeriods(c, G);
  let n = 0, body = '', prevDen = null, bandIx = -1;
  G.forEach((g, gi) => {
    const atP0 = forceP || (c.alignFam ? FP[g.fam || '_'] : null);
    /* ★ 분모가 좁아지는 지점마다 <b>묶음 머리</b>를 넣습니다.
       "가입자 2,560명 중" → "그 946명 중" → "그 249명 중".
       퍼널은 <b>위 줄의 이용자수가 아래 줄의 분모</b>라는 게 눈에 보여야 읽힙니다. */
    const dn = c.denBands ? denOf(g.spec) : '';
    if (dn && dn !== prevDen) {
      /* 묶음의 첫 줄이 미확정이면 분모가 비므로, 같은 묶음에서 <b>값이 있는 줄</b>을 찾아 씁니다
         (같은 묶음은 정의상 분모가 같습니다 — 그래서 어느 줄에서 가져와도 같은 수입니다) */
      let den = null;
      for (const g2 of G) {
        if (denOf(g2.spec) !== dn) continue;
        const r2 = pickAt(build(cardFor(c, g2.spec), g2.spec), atP0);
        if (r2 && r2.den != null) { den = r2.den; break; }
      }
      /* 표 머리는 <b>맨 처음 한 번만</b> 답니다. 그 아래 단계의 분모는 이미
         분모 열에 숫자로 나와 있어 줄을 더 두면 표만 길어집니다. */
      if (!prevDen) {
        const cnt = den != null ? `<b>${nf(den)}</b>명 중` : '';
        body += `<tr class="aband"><td colspan="8"><b>${esc(dn)}</b> ${cnt}</td></tr>`;
      }
      prevDen = dn; bandIx += 1;
    }
    const band = (c.denBands ? bandIx : gi) % 2 ? ' gband' : '';
    const has = g.children && g.children.length ? ' has' : '';
    const gid = c.id + '-' + gi;
    const atP = atP0;
    n += 1 + (g.children ? g.children.length : 0);
    const op = GRPOPEN.has(gid);
    body += metricRow(c, g.spec, 'grow' + has + band + (op ? ' open' : ''), g.label, atP)
              .replace('<tr class="', `<tr data-grp="${gid}" class="`);
    (g.children || []).forEach(k => {
      body += metricRow(c, k.spec, 'child' + band, k.label, atP)
                .replace('<tr class="', `<tr${op ? '' : ' hidden'} data-of="${gid}" class="`);
    });
    if (g.note) body += `<tr${op ? '' : ' hidden'} data-of="${gid}" class="child${band}">
      <td colspan="8" class="note">${g.note}</td></tr>`;
  });
  const unitW = c.g === '주간' ? '주' : '달';
  /* 줄마다 분모가 달라지는 표(주문)와 전 줄 분모가 같은 표(리텐션)는 읽는 법이 다릅니다 */
  const denNote = c.subsFrom === '5. 구독리텐션'
    ? `<br><b>분모는 전 줄이 같습니다</b> — 그 달 <b>첫 구독료 결제 코호트</b> 전체(누적). 회차가 뒤로 갈수록 <b>이용자수만 줄어들므로 값은 반드시 내려갑니다.</b>`
    : '';
  const aligned = forceP
    ? `<p class="mnote" style="margin:0 0 8px">모든 줄을 <b>${forceP} 코호트</b>로 맞췄습니다 — 위의 <b>기준</b>이 그 ${unitW}로 잡혀 있기 때문입니다.
       그 코호트에서 창이 아직 안 찬 줄은 값을 만들지 않고 <b>미확정</b>으로 둡니다 (빈칸을 0 이나 하락으로 오해하지 않도록).${denNote}</p>`
    : c.alignFam
    ? `<p class="mnote" style="margin:0 0 8px">퍼널을 읽을 수 있도록 같은 갈래는 <b>1·2·3회차가 모두 확정된 같은 코호트</b>로 맞췄습니다
       — 그래서 <b>분모가 같고 이용자수만 줄어듭니다.</b> 줄마다 최신 확정을 쓰면 코호트가 섞여 분모가 널뛰고 퍼널이 깨집니다.<br>
       갈래마다 확정 시점이 달라 <b>일반과 플러스의 코호트 달이 다를 수 있고</b>, 위 카드의 대표 값은 <b>최신 확정 코호트</b>라 이 표와 달이 다를 수 있습니다.</p>` : '';
  return `<details class="det" data-det="${c.id}"${DETOPEN.has(c.id) ? ' open' : ''}><summary class="dsum">상세 보기 · ${G.length}개 그룹 · 하위 ${n}줄</summary>
    <div style="margin-top:10px">${aligned}
    <div class="tw" style="max-height:none"><table>
    <thead><tr><th style="width:28%">하위 지표</th><th>코호트</th><th>값</th><th>이용자수</th><th>분모</th>
      <th>${MAW(c.g)}${c.g === '주간' ? '주' : '개월'} 평균</th><th>전년 동기</th>
      <th>차이 / 전년비</th></tr></thead>
    <tbody>${body}</tbody></table></div></div></details>`;
}

/* 전체 기간 표 */
function renderTable() {
  const g = TAB, P = PERV(g);
  const cols = [];
  const seenCol = new Set();
  const push = o => {
    const k = o.s ? kk(mainSel(o.s).cat, mainSel(o.s).d1, mainSel(o.s).d2)
                  : (o.c.sel ? kk(o.c.sel.cat, o.c.sel.d1, o.c.sel.d2) : o.c.id);
    if (seenCol.has(k)) return;                 /* 대표 줄이 하위에도 있으면 열을 한 번만 */
    seenCol.add(k); cols.push(o);
  };
  CARDS.filter(c => c.g === g).forEach(c => {
    push({ c, s: null, label: c.name.split(' · ')[0] });
    /* 상세와 같은 그룹 순서로 열을 만듭니다 (대표 줄 → 자식 줄) */
    groupsOf(c).forEach(g => {
      push({ c, s: g.spec, label: g.label.replace(/\s*\(.*?\)/g, '') });
      (g.children || []).forEach(k => push({ c, s: k.spec, label: (g.label.split(' · ')[0] + '·' + k.label).replace(/\s*\(.*?\)/g, '') }));
    });
  });
  const CC = cols.map(o => cardFor(o.c, o.s));
  const S = cols.map((o, i) => new Map(build(CC[i], o.s).map(x => [x.p, x])));
  const U = cols.map((o, i) => (CC[i].kind === 'rate' ? '' : unitOf(o.c, o.s)));
  let t = '<thead><tr><th>기간</th>' + cols.map(o => `<th>${esc(o.label)}</th>`).join('') + '</tr></thead><tbody>';
  [...P].reverse().forEach(p => {
    t += `<tr><td class="wkc">${p}</td>` + cols.map((o, i) => {
      const r = S[i].get(p);
      if (!r || r.v == null) return '<td style="color:var(--muted)">·</td>';
      const col = r.j === '악화' || r.j === '감소' ? 'var(--crit)'
                : r.j === '개선' || r.j === '증가' ? 'var(--goodtxt)' : 'inherit';
      const v = CC[i].kind === 'rate' ? r.v.toFixed(1) : fmt(r.v, CC[i], U[i]);
      return `<td style="color:${col}">${v}</td>`;
    }).join('') + '</tr>';
  });
  $('tall').innerHTML = t + '</tbody>';
}

function renderDefs() {
  const t = $('defbody'); if (!t || t.dataset.done) return;
  t.innerHTML = '<div class="tw" style="max-height:none"><table><thead><tr>'
    + '<th style="width:26%">지표</th><th style="text-align:left">정의 · 읽는 법</th></tr></thead><tbody>'
    + DEFS.map(([a, b]) => `<tr><td style="font-weight:600;color:var(--ink);vertical-align:top;white-space:normal">${a}</td>
        <td style="text-align:left;color:var(--ink2);white-space:normal;line-height:1.65">${b}</td></tr>`).join('')
    + '</tbody></table></div>';
  t.dataset.done = '1';
}

/* ══ CSV ════════════════════════════════════════════════════════════ */
function parseCsv(t) {
  const rows = []; let cell = '', row = [], q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 && r.some(x => x.trim() !== ''));
}
function toRecords(text) {
  const rows = parseCsv(text.replace(/^﻿/, '').trim());
  if (!rows.length) throw new Error('빈 파일');
  const hdr = rows[0].map(c => (c || '').trim());
  const col = nm => hdr.findIndex(h => h === nm);
  const IX = { g: col('기간구분'), p: col('기간'), no: col('No'), cat: col('대분류'),
               d1: col('1Depth'), d2: col('2Depth'), users: col('이용자수'), den: col('분모'),
               rate: col('이용률(%)'), amt: col('금액'), unit: col('단위'), obs: col('확정') };
  if (IX.g < 0 || IX.p < 0 || IX.cat < 0 || IX.d1 < 0)
    throw new Error('50번 결과 CSV 가 아닙니다 — "기간구분 · 기간 · 대분류 · 1Depth" 컬럼이 필요합니다');
  const num = s => { const x = parseFloat(String(s).replace(/,/g, '')); return isNaN(x) ? null : x; };
  const g = (r, i) => (i >= 0 ? (r[i] || '').trim() : '');
  const out = rows.slice(1).map(r => ({
    g: g(r, IX.g), p: g(r, IX.p), no: num(g(r, IX.no)),
    cat: g(r, IX.cat), d1: g(r, IX.d1), d2: g(r, IX.d2),
    users: num(g(r, IX.users)), den: num(g(r, IX.den)), rate: num(g(r, IX.rate)),
    amt: num(g(r, IX.amt)), unit: g(r, IX.unit),
    obs: IX.obs >= 0 ? (num(g(r, IX.obs)) === 0 ? 0 : 1) : 1
  })).filter(r => r.p && r.cat && (r.g === '주간' || r.g === '월간'));
  if (!out.length) throw new Error('읽을 행이 없습니다');
  return out;
}
function decode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) {
    for (const enc of ['euc-kr', 'windows-949']) { try { return new TextDecoder(enc).decode(buf); } catch (_) {} }
    return new TextDecoder('utf-8').decode(buf);
  }
}
function say(t, cls) { const m = $('msg'); m.textContent = t; m.className = cls || ''; }
function apply(recs, label) {
  DATA = recs; reindex();
  say(`${label} · ${DATA.length}행 · 주간 ${PER['주간'].length}주 · 월간 ${PER['월간'].length}개월`, 'ok');
  try { localStorage.setItem('metric_def', JSON.stringify({ recs: DATA, label, at: Date.now() })); } catch (e) {}
  render();
}
function loadFile(f) {
  if (!f) return;
  if (!/\.(csv|txt)$/i.test(f.name)) { say('CSV 파일만 됩니다 (' + f.name + ')', 'err'); return; }
  const rd = new FileReader();
  rd.onload = () => { try { const t = decode(rd.result); LAST_CSV = t; apply(toRecords(t), f.name); }
                      catch (e) { say('읽기 실패 — ' + e.message, 'err'); } };
  rd.onerror = () => say('파일을 열지 못했습니다', 'err');
  rd.readAsArrayBuffer(f);
}

/* ══ 데이터를 품은 HTML 로 내보내기 ═════════════════════════════════ */
function b64utf8(str) {
  const u = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(bin);
}
function exportBaked() {
  if (!LAST_CSV || !LAST_CSV.trim()) { say('먼저 CSV 를 올려주세요', 'err'); return; }
  const IDS = ['alerts', 'body', 'tall', 'defbody', 'foot', 'msg'];
  const keep = {};
  IDS.forEach(i => { const el = $(i); if (el) { keep[i] = el.innerHTML; el.innerHTML = ''; } });
  const dt = $('defbody'); const done = dt && dt.dataset.done;
  if (dt) delete dt.dataset.done;
  let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  IDS.forEach(i => { const el = $(i); if (el && keep[i] != null) el.innerHTML = keep[i]; });
  if (dt && done) dt.dataset.done = done;

  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  html = html.replace(/const BAKED_B64 = '[^']*';/, "const BAKED_B64 = '" + b64utf8(LAST_CSV) + "';")
             .replace(/const BAKED_TASKS_B64 = '[^']*';/,
                      "const BAKED_TASKS_B64 = '" + b64utf8(JSON.stringify(TASKS)) + "';")
             .replace(/const BUILD_ID = '[^']*';/, "const BUILD_ID = '" + stamp + "';");
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  a.download = '주간지표회의_' + stamp.slice(0, 8) + '.html';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  const nT = Object.values(TASKS).reduce((a, x) => a + x.length, 0);
  say(`내보냈습니다 — CSV${nT ? ' + 과제 ' + nT + '건' : ''} 이 파일 안에 들어 있습니다`, 'ok');
}
function resetData() {
  DATA = []; LAST_CSV = '';
  /* 과제는 지우지 않습니다 — CSV 를 새로 올려도 그대로 붙어 있어야 하기 때문입니다 */
  try { localStorage.removeItem('metric_def'); } catch (e) {}
  say('비웠습니다', ''); render();
}

$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
/* 그룹 펼침 — 행에 id 를 쓰지 않고 data 속성으로만 묶어 내보내기에 영향이 없게 합니다 */
$('body').addEventListener('click', e => {
  const tr = e.target.closest('tr.grow.has');
  if (tr) {
    const id = tr.dataset.grp, open = tr.classList.toggle('open');
    if (open) GRPOPEN.add(id); else GRPOPEN.delete(id);
    tr.closest('tbody').querySelectorAll(`tr[data-of="${id}"]`).forEach(x => { x.hidden = !open; });
    return;
  }
  const bc = e.target.closest('[data-basis]');
  if (bc) { const [cid, k] = bc.dataset.basis.split('|'); BASIS[cid] = k; render(); return; }
  const add = e.target.closest('[data-add]');
  if (add) { OPENFORM = add.dataset.add; render();
    const el = document.querySelector('.tk-form [data-f="title"]'); if (el) el.focus(); return; }
  if (e.target.closest('[data-cancel]')) { OPENFORM = null; render(); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const [cid, tid] = del.dataset.del.split('|');
    TASKS[cid] = (TASKS[cid] || []).filter(t => String(t.id) !== tid);
    if (!TASKS[cid].length) delete TASKS[cid];
    saveTasks(); render(); return;
  }
  const sv = e.target.closest('[data-save]');
  if (sv) {
    const box = sv.closest('.tk-form');
    const gv = k => (box.querySelector(`[data-f="${k}"]`) || {}).value || '';
    const title = gv('title').trim();
    if (!title) { say('과제 이름을 적어주세요', 'err'); return; }
    const cid = sv.dataset.save;
    (TASKS[cid] = TASKS[cid] || []).push({
      id: Date.now().toString(36), title, date: gv('date'), owner: gv('owner').trim(), memo: gv('memo').trim()
    });
    OPENFORM = null; saveTasks(); render();
    say('과제를 저장했습니다 — 「데이터 넣어 내보내기」 를 누르면 CSV 와 함께 파일에 들어갑니다', 'ok');
  }
});
$('body').addEventListener('toggle', e => {
  const d = e.target.closest ? e.target.closest('details[data-det]') : null;
  if (!d) return;
  if (d.open) DETOPEN.add(d.dataset.det); else DETOPEN.delete(d.dataset.det);
}, true);
$('body').addEventListener('change', e => {
  const sel = e.target.closest('[data-asof]');
  if (!sel) return;
  const g = sel.dataset.asof, ch = asofChoices(g);
  ASOF[g] = (sel.value === ch[0]) ? null : sel.value;   /* 최신이면 제한 없음 */
  render();
});
function saveTasks() {
  try { localStorage.setItem('metric_def_tasks', JSON.stringify(TASKS)); } catch (e) {}
}
$('gtabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  TAB = b.dataset.g;
  [...$('gtabs').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  renderTable();
});
const dz = $('drop');
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); dz.classList.add('over');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  if (ev === 'drop') e.preventDefault();
  if (ev === 'dragleave' && e.relatedTarget) return;
  dz.classList.remove('over');
}));
document.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]); });

if (BAKED) { try { DATA = toRecords(BAKED); } catch (e) {} }
try {
  const bid = localStorage.getItem('__build__metric_def');
  if (BAKED && bid !== BUILD_ID) { localStorage.removeItem('metric_def'); localStorage.setItem('__build__metric_def', BUILD_ID); }
} catch (e) {}
(function () {
  try {
    if (!BAKED_TASKS) {
      const t = localStorage.getItem('metric_def_tasks');
      if (t) { const o = JSON.parse(t); if (o && typeof o === 'object') TASKS = o; }
    }
  } catch (e) {}
})();
(function () {
  try {
    const s = localStorage.getItem('metric_def');
    if (!s) return;
    const o = JSON.parse(s);
    if (o && Array.isArray(o.recs) && o.recs.length) {
      DATA = o.recs;
      say(`지난번 업로드 복원 (${o.label || 'CSV'} · ${new Date(o.at || Date.now()).toISOString().slice(0, 10)})`, 'ok');
    }
  } catch (e) {}
})();

render();
